name: Deploy

on:
  push:
    branches: [development, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Worker environment
        type: choice
        options: [development, staging, production]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/staging' && 'staging') || 'development' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile

      - name: Resolve targets
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="development"
          fi
          case "$ENV" in
            development) INFISICAL=dev ;;
            staging)     INFISICAL=staging ;;
            production)  INFISICAL=prod ;;
          esac
          echo "wrangler=$ENV" >> "$GITHUB_OUTPUT"
          echo "infisical=$INFISICAL" >> "$GITHUB_OUTPUT"

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: a175ad2a-4760-4cb7-8b83-5533a22b7ce9
          project-slug: mail-flow-ai-x-jcd
          env-slug: ${{ steps.target.outputs.infisical }}
          secret-path: /mailflow-web
          export-type: env

      - name: Build and deploy
        run: bun run deploy:${{ steps.target.outputs.wrangler }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
